name: Temporary authorized Barge Boss credential transfer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bargeboss-secret-transfer
  cancel-in-progress: false
jobs:
  encrypt:
    if: github.repository == 'koniho/dddumpling' && github.ref == 'refs/heads/main' && github.actor == 'koniho'
    environment: ios-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install encryption library before exposing credentials
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/transfer-python" PyNaCl==1.5.0
      - name: Encrypt only the authorized Barge Boss release credentials
        env:
          PYTHONPATH: ${{ runner.temp }}/transfer-python
          IOS_APPSTORE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_KEY_BASE64 }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_MATCH_GIT_PRIVATE_KEY: ${{ secrets.IOS_MATCH_GIT_PRIVATE_KEY }}
          IOS_MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl import encoding, public
          config = {'repository': 'koniho/bargeboss', 'environments': {'ios-release': {'key_id': '3380204578043523366', 'key': 'FswSDA7x1qd3jhbYapXtV2JFghnqXjco9JXv0D2FbEw=', 'names': ['IOS_APPSTORE_KEY_BASE64', 'IOS_APPSTORE_KEY_ID', 'IOS_APPSTORE_ISSUER_ID', 'IOS_MATCH_GIT_PRIVATE_KEY', 'IOS_MATCH_PASSWORD']}, 'android-release': {'key_id': '3380204578043523366', 'key': 'hGvFVqdYItQ/C8XxWmt5MZRxb9biW1NExQWRGCxaiiQ=', 'names': ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEY_ALIAS', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON']}}}
          output = {"repository": config["repository"], "environments": {}}
          for environment, settings in config["environments"].items():
              sealed = public.SealedBox(public.PublicKey(settings["key"].encode(), encoding.Base64Encoder()))
              payloads = {}
              for name in settings["names"]:
                  value = os.environ.get(name, "")
                  if not value:
                      raise SystemExit("Missing required source secret: " + name)
                  payloads[name] = base64.b64encode(sealed.encrypt(value.encode())).decode()
              output["environments"][environment] = {"key_id": settings["key_id"], "public_key": settings["key"], "secrets": payloads}
          path = Path(os.environ["RUNNER_TEMP"]) / "bargeboss-encrypted-transfer" / "sealed.json"
          path.parent.mkdir(mode=0o700)
          path.write_text(json.dumps(output))
          path.chmod(0o600)
          print("Prepared 10 destination-encrypted payloads; no plaintext credentials exported.")
          PY
      - name: Retain only ciphertext addressed to Barge Boss GitHub environments
        uses: actions/upload-artifact@v6
        with:
          name: bargeboss-destination-encrypted-secrets
          path: ${{ runner.temp }}/bargeboss-encrypted-transfer/sealed.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner ciphertext
        if: always()
        run: rm -rf "$RUNNER_TEMP/bargeboss-encrypted-transfer"
