name: Build iOS release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to TestFlight (no external tester distribution)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Run signed releases from main.'
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check release lanes without credentials or uploads
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          bundle exec ruby tools/test-fastlane.rb
          bundle exec ruby tools/test-ios-fastlane.rb
          bundle exec fastlane lanes

  archive:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-release
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_DOCS: '1'
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_MATCH_GIT_URL: ${{ vars.IOS_MATCH_GIT_URL }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Check signing configuration
        env:
          IOS_MATCH_GIT_PRIVATE_KEY: ${{ secrets.IOS_MATCH_GIT_PRIVATE_KEY }}
          IOS_MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_KEY_BASE64 }}
        run: |
          for key in IOS_TEAM_ID IOS_MATCH_GIT_URL IOS_MATCH_GIT_PRIVATE_KEY IOS_MATCH_PASSWORD IOS_APPSTORE_KEY_ID IOS_APPSTORE_ISSUER_ID IOS_APPSTORE_KEY_BASE64; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure $key in the ios-release environment; see ios/docs/ci.md."
              exit 1
            fi
          done
      - uses: ./.github/actions/setup-ios
        with:
          boot-simulator: 'true'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check shared production code
        run: |
          ./check.sh -q -r
          ./check.sh -q --production
          ./ios/scripts/test-input.sh
      - name: Run full native and UI release checks
        run: ./ios/scripts/test-simulator.sh --full
      - name: Build signed archive and IPA
        env:
          IOS_MATCH_GIT_PRIVATE_KEY: ${{ secrets.IOS_MATCH_GIT_PRIVATE_KEY }}
          IOS_MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_KEY_BASE64 }}
        run: bundle exec fastlane ios archive
      - name: Verify exported iPhone device family
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile
          with zipfile.ZipFile("ios/build/DDDumpling.ipa") as ipa:
              info = plistlib.loads(ipa.read("Payload/DDDumpling.app/Info.plist"))
          family = info.get("UIDeviceFamily")
          if family != [1]:
              raise SystemExit(f"Expected iPhone-only UIDeviceFamily [1], got {family!r}")
          print("Exported IPA supports iPhone only.")
          PY
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ios-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios/build/DDDumpling.ipa
            ios/build/DDDumpling.app.dSYM.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload to TestFlight
        if: inputs.upload_to_testflight == true
        env:
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_KEY_BASE64 }}
        run: bundle exec fastlane ios upload_testflight
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain dddumpling-ci.keychain-db 2>/dev/null || true
