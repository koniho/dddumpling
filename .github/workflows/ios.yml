name: Check iOS port

# The native runtime is costly to build cold; run explicitly and cache it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: brew install maven xcodegen
      - name: Record toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ios/vendor
          key: j2objc-3.1-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('ios/scripts/bootstrap.sh') }}
      - name: Build native Java runtime
        run: ./ios/scripts/bootstrap.sh
      - name: Check shared gameplay and input
        run: |
          ./check.sh -q -r
          ./check.sh -q --production
          ./ios/scripts/test-input.sh
      - name: Build simulator app
        run: ./ios/scripts/build.sh
      - name: Run native and UI tests
        run: ./ios/scripts/test-simulator.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-test-results
          path: ios/build/Test-*.xcresult
          retention-days: 7
