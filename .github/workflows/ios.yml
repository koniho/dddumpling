name: Check iOS port

on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'src/**', 'tools/**', 'assets/fonts/**', 'check.sh', '.github/actions/setup-ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'tools/**', 'assets/fonts/**', 'check.sh', '.github/actions/setup-ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ios
      - name: Check shared gameplay and input
        run: |
          ./check.sh -q -r
          ./check.sh -q --production
          ./ios/scripts/test-input.sh
      - name: Run native and UI tests
        run: ./ios/scripts/test-simulator.sh
      - name: Build unsigned device Release archive
        run: ./ios/scripts/archive.sh --unsigned
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-test-results
          path: ios/build/Test-*.xcresult
          retention-days: 7
      - name: Package unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/DDDumpling.xcarchive ios/build/DDDumpling-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ios-unsigned-archive
          path: ios/build/DDDumpling-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
