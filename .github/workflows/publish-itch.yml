name: Publish itch.io Android download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag with a signed production Android APK
        type: string
        required: true
      inspect_only:
        description: Only inspect channel versions; do not upload
        type: boolean
        default: false
      artifact_run:
        description: Optional successful manual Android build run ID for a packaging retry
        type: string
        default: ''
      activate:
        description: Update the live Android channel (otherwise create a hidden upload)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: itch-android-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing configuration
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo '::error::Add the itch.io API key as the repository secret BUTLER_API_KEY.'
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - name: Download signed release APK
        if: inputs.inspect_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          mkdir -p build/itch
          if [ -n "$ARTIFACT_RUN" ]; then
            [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]] || exit 1
            gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN" > build/retry-run.json
            python3 - <<'PY'
          import json
          r = json.load(open('build/retry-run.json'))
          assert r['conclusion'] == 'success' and r['head_branch'] == 'main'
          assert r['path'] == '.github/workflows/release.yml' and r['event'] == 'workflow_dispatch'
          PY
            sha=$(python3 -c 'import json; print(json.load(open("build/retry-run.json"))["head_sha"])')
            gh api "repos/$GH_REPO/contents/AndroidManifest.xml?ref=$sha" --jq .content | base64 --decode > build/retry-manifest.xml
            python3 - <<'PY'
          import os, xml.etree.ElementTree as E
          version = E.parse('build/retry-manifest.xml').getroot().get('{http://schemas.android.com/apk/res/android}versionName')
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
            gh run download "$ARTIFACT_RUN" --name "DDDUMPLING-build-$ARTIFACT_RUN" --dir build/release-artifact
            cp "build/release-artifact/DDDUMPLING-build-$ARTIFACT_RUN.apk" "build/itch/DDDUMPLING-$RELEASE_TAG.apk"
          elif ! gh release download "$RELEASE_TAG" \
            --pattern "DDDUMPLING-${RELEASE_TAG}.apk" --dir build/itch; then
            # Draft releases need push access; use the same verified CI artifact with read access.
            sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            run=$(gh run list --workflow release.yml --commit "$sha" --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            test -n "$run" && test "$run" != null
            gh run download "$run" --name "DDDUMPLING-${RELEASE_TAG}" --dir build/release-artifact
            cp "build/release-artifact/DDDUMPLING-${RELEASE_TAG}.apk" build/itch/
          fi
          test -s "build/itch/DDDUMPLING-${RELEASE_TAG}.apk"

      - name: Install pinned butler
        run: |
          curl --fail --location --retry 3 \
            https://github.com/itchio/butler/releases/download/v15.31.0/butler-linux-amd64.zip \
            --output "$RUNNER_TEMP/butler.zip"
          echo "1e536377187894ef5fe7f35edfb29df256df63e50e7f6b97ebd54bc5aba4c055  $RUNNER_TEMP/butler.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/linux-amd64/butler"

      - name: Inspect channels
        if: inputs.inspect_only == true
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: '"$RUNNER_TEMP/butler/linux-amd64/butler" status theorifice/dddumpling'

      - name: Upload Android build
        if: inputs.inspect_only != true
        env:
          ACTIVATE: ${{ inputs.activate }}
          LIVE_CHANNEL: ${{ vars.ITCH_ANDROID_CHANNEL || 'android' }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          channel="$LIVE_CHANNEL"
          [[ "$channel" =~ ^[a-z0-9][a-z0-9-]*$ ]] || exit 1
          flags=()
          if [ "$ACTIVATE" != true ]; then
            channel="android-staged-${RELEASE_TAG//./-}-${GITHUB_RUN_ID}"
            flags+=(--hidden)
          fi
          "$RUNNER_TEMP/butler/linux-amd64/butler" push build/itch "theorifice/dddumpling:$channel" \
            --userversion "${RELEASE_TAG#v}" "${flags[@]}"
          "$RUNNER_TEMP/butler/linux-amd64/butler" status "theorifice/dddumpling:$channel"
