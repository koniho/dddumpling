name: Build Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_tag:
        description: Optional existing version tag to rebuild (download artifacts only; no Play upload)
        type: string
        default: ""
      upload_to_play:
        description: Upload this build to the selected Google Play testing track
        type: boolean
        default: false
      play_track:
        description: Testing destination (version tags always use closed)
        type: choice
        options:
          - closed
          - internal
        default: closed


env:
  RELEASE_ARTIFACT: ${{ inputs.source_tag || (github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_id)) }}

permissions:
  contents: write

jobs:
  validate_fastlane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify upload configuration without publishing
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
        run: |
          python3 tools/test-prepare-release.py
          bundle exec ruby tools/test-fastlane.rb
          bundle exec fastlane lanes

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}

      - name: Validate rebuild tag
        if: inputs.source_tag != ''
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          tag = os.environ['SOURCE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected vMAJOR.MINOR.PATCH tag'
          version = ET.parse('AndroidManifest.xml').getroot().get('{http://schemas.android.com/apk/res/android}versionName')
          assert tag == 'v' + version, 'Tag and manifest version do not match'
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > build/release.keystore

      - name: Build signed production bundle
        env:
          DDDUMPLING_PLAY_CONFIG: ""
          HEXATYPE_KEYSTORE: build/release.keystore
          HEXATYPE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEXATYPE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEXATYPE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build-bundle.sh

      - name: Verify offline production bundle
        run: python3 tools/verify-offline-bundle.py build/DDDUMPLING.aab

      - name: Preserve and verify signed production APK
        run: |
          cp hexatype.apk "DDDUMPLING-${RELEASE_ARTIFACT}.apk"
          apksigner verify --verbose "DDDUMPLING-${RELEASE_ARTIFACT}.apk"
          aapt2 dump badging "DDDUMPLING-${RELEASE_ARTIFACT}.apk" > build/production-apk-badging.txt
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          badging = Path('build/production-apk-badging.txt').read_text()
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert package, 'Missing APK package metadata'
          assert package.groups() == ('com.dddumpling.game', root.get(ns + 'versionCode'), root.get(ns + 'versionName')), 'Unexpected APK identity or version'
          assert 'application-debuggable' not in badging, 'Production APK must not be debuggable'
          assert 'android.permission.INTERNET' not in badging, 'Offline APK must not have network access'
          assert 'android.permission.ACCESS_NETWORK_STATE' not in badging, 'Unexpected network permission'
          print('Verified signed offline production APK:', package.groups())
          PY

      - name: Build developer APK
        env:
          HEXATYPE_KEYSTORE: build/release.keystore
          HEXATYPE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEXATYPE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEXATYPE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh --developer --full-checks

      - name: Name upload files
        run: |
          cp build/DDDUMPLING.aab "DDDUMPLING-${RELEASE_ARTIFACT}.aab"
          cp hexatype.apk "DDDUMPLING-${RELEASE_ARTIFACT}-developer.apk"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: DDDUMPLING-${{ env.RELEASE_ARTIFACT }}
          if-no-files-found: error
          path: |
            DDDUMPLING-${{ env.RELEASE_ARTIFACT }}.aab
            DDDUMPLING-${{ env.RELEASE_ARTIFACT }}.apk
            DDDUMPLING-${{ env.RELEASE_ARTIFACT }}-developer.apk

      - name: Publish GitHub release
        if: inputs.source_tag == '' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "DDDUMPLING-${RELEASE_ARTIFACT}.aab" \
              "DDDUMPLING-${RELEASE_ARTIFACT}.apk" \
              "DDDUMPLING-${RELEASE_ARTIFACT}-developer.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "DDDUMPLING-${RELEASE_ARTIFACT}.aab" \
              "DDDUMPLING-${RELEASE_ARTIFACT}.apk" \
              "DDDUMPLING-${RELEASE_ARTIFACT}-developer.apk" \
              --generate-notes --title "DDDUMPLING ${GITHUB_REF_NAME}"
          fi

  upload_testing:
    needs: [release, validate_fastlane]
    if: inputs.source_tag == '' && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_play == true)
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-testing
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in repository secrets. See app-store/play-publishing.md."
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: DDDUMPLING-${{ env.RELEASE_ARTIFACT }}
          path: build/play-artifact
      - name: Select the signed production bundle
        run: cp "build/play-artifact/DDDUMPLING-${RELEASE_ARTIFACT}.aab" build/DDDUMPLING.aab
      - name: Publish to selected testing track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          PLAY_TEST_CHANNEL: ${{ github.event_name == 'push' && 'closed' || inputs.play_track }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
        run: bundle exec fastlane android testing
