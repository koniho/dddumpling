name: Build Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > build/release.keystore

      - name: Build signed production bundle
        env:
          HEXATYPE_KEYSTORE: build/release.keystore
          HEXATYPE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEXATYPE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEXATYPE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build-bundle.sh

      - name: Build developer APK
        env:
          HEXATYPE_KEYSTORE: build/release.keystore
          HEXATYPE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEXATYPE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEXATYPE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh --developer

      - name: Name upload files
        run: |
          cp build/DDDUMPLING.aab "DDDUMPLING-${GITHUB_REF_NAME}.aab"
          cp hexatype.apk "DDDUMPLING-${GITHUB_REF_NAME}-developer.apk"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: DDDUMPLING-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            DDDUMPLING-${{ github.ref_name }}.aab
            DDDUMPLING-${{ github.ref_name }}-developer.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "DDDUMPLING-${GITHUB_REF_NAME}.aab" \
              "DDDUMPLING-${GITHUB_REF_NAME}-developer.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "DDDUMPLING-${GITHUB_REF_NAME}.aab" \
              "DDDUMPLING-${GITHUB_REF_NAME}-developer.apk" \
              --generate-notes --title "DDDUMPLING ${GITHUB_REF_NAME}"
          fi
