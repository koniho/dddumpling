name: Update unpublished store release notes
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply approved notes to the current unpublished release
        type: boolean
        default: false
      ios_store_version:
        description: Existing App Store draft version, if different from the shared release
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: store-release-notes
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    environment: ios-release
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Read or update release notes without publishing
        env:
          APPLY: ${{ inputs.apply }}
          IOS_STORE_VERSION: ${{ inputs.ios_store_version }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_KEY_BASE64 }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--write); fi
          bundle exec ruby tools/store-release-notes.rb "${args[@]}"
