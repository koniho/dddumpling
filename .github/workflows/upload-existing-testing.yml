name: Upload existing release to closed testing
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching the current manifest version
        type: string
        required: true
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-testing
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate release and publishing options
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('AndroidManifest.xml').getroot()
          version = root.get('{http://schemas.android.com/apk/res/android}versionName')
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match the current release version'
          PY
          bundle exec ruby tools/test-fastlane.rb
      - name: Download the existing signed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/download sdk
          gh release download "$RELEASE_TAG" --pattern "DDDUMPLING-${RELEASE_TAG}.aab" --dir build/download
          mv "build/download/DDDUMPLING-${RELEASE_TAG}.aab" build/DDDUMPLING.aab
          curl --fail --location --retry 3 --output sdk/bundletool-all-1.18.3.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  sdk/bundletool-all-1.18.3.jar' | sha256sum --check --status
          python3 tools/verify-offline-bundle.py build/DDDUMPLING.aab
      - name: Upload to closed testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TEST_CHANNEL: closed
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
        run: bundle exec fastlane android testing
