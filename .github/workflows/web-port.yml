name: Web port preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'src/**/*.java', 'ios/java/**', 'check.sh', 'tools/build-flags.sh', 'assets/fonts/**', '.github/workflows/web-port.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host tests and browser build
        run: |
          python3 web/build.py
          python3 web/build.py --playables
      - uses: actions/upload-artifact@v6
        with:
          name: web-playable-preview
          path: build/web/
      - uses: actions/upload-artifact@v6
        with:
          name: youtube-playables-preview
          path: build/web-playables/
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        with:
          name: web-playable-preview
          path: build/web/
      - uses: actions/download-artifact@v6
        with:
          name: youtube-playables-preview
          path: build/web/playables/
      - name: Browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/web-check" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/web-check/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Browser validation
        env:
          SITE_TEST_DEPS: ${{ runner.temp }}/web-check
          WEB_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory build/web > build/web-server.log 2>&1 &
          node web/test/playables.mjs
          node web/test/browser.mjs
          node web/test/octopulse.mjs
          node web/test/divide.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-preview-review-${{ matrix.engine }}
          path: |
            build/web-review/
            build/web-server.log
