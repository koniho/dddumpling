name: Web port preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'src/**/*.java', 'ios/java/**', 'check.sh', 'tools/build-flags.sh', 'assets/fonts/**', '.github/workflows/web-port.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host tests and browser build
        run: python3 web/build.py
      - name: Browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/web-check" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/web-check/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Chromium and WebKit validation
        env:
          SITE_TEST_DEPS: ${{ runner.temp }}/web-check
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory build/web > build/web-server.log 2>&1 &
          node web/test/browser.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-preview-review
          path: |
            build/web-review/
            build/web-server.log
      - uses: actions/upload-artifact@v6
        with:
          name: web-playable-preview
          path: build/web/
