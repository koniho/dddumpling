<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1090" viewBox="0 0 1080 1090"><rect x="0" y="0" width="1080" height="1090" rx="0" fill="#122323"/><text x="54" y="55" font-family="sans-serif" font-size="19" font-weight="700" fill="#9be0af">DDDUMPLING / PLAYTEST NOTES</text><text x="54" y="113" font-family="sans-serif" font-size="42" font-weight="700" fill="#f4f1df">Keep the action. Ease the workload.</text><text x="54" y="158" font-family="sans-serif" font-size="25" font-weight="400" fill="#b9cebf">The stage still ramps. Assistance changes what each enemy asks of you.</text><rect x="54" y="205" width="972" height="185" rx="25" fill="#203837"/><text x="84" y="257" font-family="sans-serif" font-size="30" font-weight="700" fill="#9be0af">EXTRA HELP</text><text x="84" y="324" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">3 presses max</text><text x="406" y="324" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">2 symbols max</text><text x="728" y="324" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">75% speed</text><rect x="54" y="425" width="972" height="185" rx="25" fill="#203837"/><text x="84" y="477" font-family="sans-serif" font-size="30" font-weight="700" fill="#9be0af">LIGHT HELP</text><text x="84" y="544" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">5 presses max</text><text x="406" y="544" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">3 symbols max</text><text x="728" y="544" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">90% speed</text><rect x="54" y="645" width="972" height="185" rx="25" fill="#203837"/><text x="84" y="697" font-family="sans-serif" font-size="30" font-weight="700" fill="#9be0af">NORMAL</text><text x="84" y="764" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">7 presses max</text><text x="406" y="764" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">Normal variety</text><text x="728" y="764" font-family="sans-serif" font-size="28" font-weight="400" fill="#f4f1df">100% speed</text><text x="54" y="890" font-family="sans-serif" font-size="25" font-weight="400" fill="#b9cebf">Caps include stacked pips. Stage and land limits still apply.</text><text x="54" y="937" font-family="sans-serif" font-size="26" font-weight="400" fill="#f4f1df">Spawn intervals, crowd limits and wave quotas stay on the</text><text x="54" y="974" font-family="sans-serif" font-size="26" font-weight="400" fill="#f4f1df">existing ramp. Boss mechanics stay separate.</text><text x="54" y="1041" font-family="sans-serif" font-size="23" font-weight="400" fill="#ffcf77">New players start with four keys. Returning players keep their saved tier.</text></svg>