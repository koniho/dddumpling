ont-weight="400" fill="#b9cebf">Normal</text><path d="M230,597 L1000,597" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><path d="M235.0,703 H304.0909090909091 V703 H373.1818181818182 V703 H442.27272727272725 V703 H511.3636363636364 V703 H580.4545454545455 V703 H649.5454545454545 V703 H718.6363636363636 V703 H787.7272727272727 V703 H856.8181818181819 V650 H925.9090909090909 V650 H995.0 V650" stroke="#9be0af" stroke-width="6" fill="none" stroke-linejoin="round"/><circle cx="304.0909090909091" cy="703" r="5" fill="#9be0af"/><circle cx="373.1818181818182" cy="703" r="5" fill="#9be0af"/><circle cx="442.27272727272725" cy="703" r="5" fill="#9be0af"/><circle cx="511.3636363636364" cy="703" r="5" fill="#9be0af"/><circle cx="580.4545454545455" cy="703" r="5" fill="#9be0af"/><circle cx="649.5454545454545" cy="703" r="5" fill="#9be0af"/><circle cx="718.6363636363636" cy="703" r="5" fill="#9be0af"/><circle cx="787.7272727272727" cy="703" r="5" fill="#9be0af"/><circle cx="856.8181818181819" cy="650" r="5" fill="#9be0af"/><circle cx="925.9090909090909" cy="650" r="5" fill="#9be0af"/><circle cx="995.0" cy="650" r="5" fill="#9be0af"/><text x="295.0909090909091" y="733" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">11</text><text x="571.4545454545455" y="733" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">15</text><text x="847.8181818181819" y="733" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">19</text><text x="986.0" y="733" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">21</text><text x="60" y="772" font-family="sans-serif" font-size="23" font-weight="400" fill="#ffcf77">Five power-up stages held. Light Help only after stage 19.</text><rect x="36" y="815" width="1008" height="290" rx="25" fill="#203837"/><text x="60" y="858" font-family="sans-serif" font-size="27" font-weight="700" fill="#f4f1df">3. One strong stage gets help out of the way</text><text x="60" y="1020" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Extra Help</text><path d="M230,1013 L1000,1013" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><text x="60" y="967" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Light Help</text><path d="M230,960 L1000,960" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><text x="60" y="914" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Normal</text><path d="M230,907 L1000,907" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><path d="M235.0,960 H387.0 V907 H539.0 V907 H691.0 V907 H843.0 V907 H995.0 V907" stroke="#9be0af" stroke-width="6" fill="none" stroke-linejoin="round"/><circle cx="387.0" cy="907" r="5" fill="#9be0af"/><circle cx="539.0" cy="907" r="5" fill="#9be0af"/><circle cx="691.0" cy="907" r="5" fill="#9be0af"/><circle cx="843.0" cy="907" r="5" fill="#9be0af"/><circle cx="995.0" cy="907" r="5" fill="#9be0af"/><text x="378.0" y="1043" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">16</text><text x="682.0" y="1043" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">18</text><text x="986.0" y="1043" font-family="sans-serif" font-size="20" font-weight="400" fill="#b9cebf">20</text><text x="60" y="1082" font-family="sans-serif" font-size="23" font-weight="400" fill="#ffcf77">Light Help → Normal after stage 16. One hit did not undo it.</text><text x="54" y="1170" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">X axis: stage. Assessment happens at the end; changes apply next stage.</text><text x="54" y="1208" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Different runs and starting points. This is not a controlled comparison.</text></svg>