<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1245" viewBox="0 0 1080 1245"><rect x="0" y="0" width="1080" height="1245" rx="0" fill="#122323"/><text x="54" y="55" font-family="sans-serif" font-size="19" font-weight="700" fill="#9be0af">DDDUMPLING / PLAYTEST NOTES</text><text x="54" y="113" font-family="sans-serif" font-size="42" font-weight="700" fill="#f4f1df">Three versions. Three playtests.</text><text x="54" y="158" font-family="sans-serif" font-size="25" font-weight="400" fill="#b9cebf">What actually happened to the assistance level after each stage.</text><rect x="36" y="195" width="1008" height="290" rx="25" fill="#203837"/><text x="60" y="238" font-family="sans-serif" font-size="27" font-weight="700" fill="#f4f1df">1. A strict streak kept help switched on</text><text x="60" y="400" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Extra Help</text><path d="M230,393 L1000,393" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><text x="60" y="347" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Light Help</text><path d="M230,340 L1000,340" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><text x="60" y="294" font-family="sans-serif" font-size="21" font-weight="400" fill="#b9cebf">Normal</text><path d="M230,287 L1000,287" fill="none" stroke="#37504b" stroke-width="1" stroke-linecap="round"/><path d="M235.0,393 H285.6666666666667 V393 H336.3333333333333 V393 H387.0 V393 H437.66666666666663 V393 H488.3333333333333 V393 H539.0 V393 H589.6666666666667 V393 H640.3333333333333 V393 H691.0 V393 H741.6666666666666 V393 H792.3333333333333 V393 H843.0 V393 H893.6666666666667 V393 H944.3333333333334 V393 H995.0 V393" stroke="#9be0af" stroke-width="6" fill="none" stroke-linejoin="round"/><circle cx="285.6666666666667" cy="393" r="5" fill="#9be0af"/><circle cx="336.3333333333333" cy="393" r="5" fill="#9be0af"/><circle cx="387.0" cy="393" r="5" fill="#9be0af"/><circle cx=