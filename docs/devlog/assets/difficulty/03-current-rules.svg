<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1135" viewBox="0 0 1080 1135"><rect x="0" y="0" width="1080" height="1135" rx="0" fill="#122323"/><text x="54" y="55" font-family="sans-serif" font-size="19" font-weight="700" fill="#9be0af">DDDUMPLING / PLAYTEST NOTES</text><text x="54" y="113" font-family="sans-serif" font-size="42" font-weight="700" fill="#f4f1df">Quick to challenge. Slower to back off.</text><text x="54" y="158" font-family="sans-serif" font-size="25" font-weight="400" fill="#b9cebf">The rules for ordinary Adventure stages now.</text><rect x="54" y="205" width="972" height="135" rx="25" fill="#203837"/><text x="82" y="250" font-family="sans-serif" font-size="26" font-weight="700" fill="#ffcf77">POWER-UP USED</text><text x="82" y="296" font-family="sans-serif" font-size="24" font-weight="400" fill="#f4f1df">Hold the tier and confidence. Even if damage occurred.</text><rect x="54" y="360" width="972" height="135" rx="25" fill="#203837"/><text x="82" y="405" font-family="sans-serif" font-size="26" font-weight="700" fill="#9be0af">NO DAMAGE + STRONG PLAY</text><text x="82" y="451" font-family="sans-serif" font-size="24" font-weight="400" fill="#f4f1df">Remove one level of help. Clear earlier negative confidence.</text><rect x="54" y="515" width="972" height="135" rx="25" fill="#203837"/><text x="82" y="560" font-family="sans-serif" font-size="26" font-weight="700" fill="#f49d9d">DAMAGE, WITHOUT A POWER-UP</text><text x="82" y="606" font-family="sans-serif" font-size="24" font-weight="400" fill="#f4f1df">Subtract one point. At −3, add one level of help and reset.</text><rect x="54" y="670" width="972" height="135" rx="25" fill="#203837"/><text x="82" y="715" font-family="sans-serif" font-size="26" font-weight="700" fill="#b9cebf">BORDERLINE PLAY</text><text x="82" y="761" font-family="sans-serif" font-size="24" font-weight="400" fill="#f4f1df">Hold. A few missed keys do not wipe out progress.</text><text x="54" y="872" font-family="sans-serif" font-size="25" font-weight="400" fill="#f4f1df">Strong = 8+ correct inputs at 90% accuracy, OR observed</text><text x="54" y="908" font-family="sans-serif" font-size="25" font-weight="400" fill="#f4f1df">top-entry enemies never reaching halfway. No damage.</text><text x="54" y="967" font-family="sans-serif" font-size="26" font-weight="700" fill="#9be0af">Rescue is neutral. Bosses and power-up stages hold.</text><text x="54" y="1022" font-family="sans-serif" font-size="23" font-weight="400" fill="#b9cebf">Game over has a separate fallback: early ordinary losses restore</text><text x="54" y="1056" font-family="sans-serif" font-size="23" font-weight="400" fill="#b9cebf">four keys + Extra Help; later ordinary losses add one tier of help.</text><text x="54" y="1090" font-family="sans-serif" font-size="23" font-weight="400" fill="#b9cebf">Boss and power-up losses keep the saved tier.</text></svg>